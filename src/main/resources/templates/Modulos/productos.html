<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: base(~{::contenido})}">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Productos - PC Store</title>
</head>
<body>
    <main th:fragment="contenido" class="container my-5">
        <!-- Todo envuelto en un único formulario para unificar los filtros -->
        <form th:action="@{/user/productos}" method="get" id="filterForm">
            <div class="row g-4">

                <!-- ================= COLUMNA FILTROS (Sidebar) ================= -->
                <div class="col-lg-3 col-md-4 mb-4">
                    <div th:replace="~{fragments/components :: filtrosSidebar(${categorias})}"></div>
                </div>

                <!-- ================= COLUMNA PRODUCTOS ================= -->
                <div class="col-lg-9 col-md-8">

                    <!-- Buscador y Ordenación -->
                    <div class="row g-3 mb-4">
                        <div class="col-md-8">
                            <div class="input-group shadow-sm rounded">
                                <span class="input-group-text bg-white border-0"><i class="bi bi-search text-muted"></i></span>
                                <input type="text"
                                       name="buscar"
                                       class="form-control border-0 py-2"
                                       placeholder="Buscar productos por nombre..."
                                       th:value="${param.buscar != null ? param.buscar : ''}">
                            </div>
                        </div>

                        <div class="col-md-4">
                            <select class="form-select border-0 shadow-sm py-2" name="orden" id="ordenSelect">
                                <option value="">Ordenar por</option>
                                <option value="menor" th:selected="${#strings.equals(param.orden, 'menor')}">Menor precio</option>
                                <option value="mayor" th:selected="${#strings.equals(param.orden, 'mayor')}">Mayor precio</option>
                                <option value="vendidos" th:selected="${#strings.equals(param.orden, 'vendidos')}">Más vendidos</option>
                                <option value="recientes" th:selected="${#strings.equals(param.orden, 'recientes')}">Más recientes</option>
                            </select>
                        </div>
                    </div>

                    <!-- Grid de Productos Dinámicos -->
                    <div class="row g-4">
                        <div class="col-lg-4 col-md-6" th:each="p : ${productos}">
                            <!-- Inserta la tarjeta de producto (isCatalog = true) -->
                            <div th:replace="~{fragments/components :: productoCard(${p}, true)}"></div>
                        </div>

                        <!-- Mensaje si la lista de productos está vacía -->
                        <div th:if="${#lists.isEmpty(productos)}" class="col-12 text-center py-5">
                            <i class="bi bi-search-heart text-muted display-2 d-block mb-3"></i>
                            <p class="text-muted lead">No encontramos ningún producto para mostrar con los filtros seleccionados.</p>
                        </div>
                    </div>

                </div>

            </div>
        </form>

        <!-- JavaScript para filtrado dinámico en tiempo real -->
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                const form = document.getElementById("filterForm");
                const priceRange = document.getElementById("priceRange");
                const priceVal = document.getElementById("priceVal");
                const checkboxes = document.querySelectorAll(".filter-checkbox");
                const ordenSelect = document.getElementById("ordenSelect");

                // Actualizar el texto del precio máximo en tiempo real
                if (priceRange && priceVal) {
                    const formatPrice = (val) => "S/ " + Number(val).toLocaleString('es-PE');
                    priceVal.textContent = formatPrice(priceRange.value);
                    
                    priceRange.addEventListener("input", function() {
                        priceVal.textContent = formatPrice(this.value);
                    });

                    // Enviar formulario cuando el usuario suelte la barra deslizadora
                    priceRange.addEventListener("change", function() {
                        form.submit();
                    });
                }

                // Enviar formulario al marcar/desmarcar categorías
                checkboxes.forEach(cb => {
                    cb.addEventListener("change", function() {
                        form.submit();
                    });
                });

                // Enviar formulario al cambiar la ordenación
                if (ordenSelect) {
                    ordenSelect.addEventListener("change", function() {
                        form.submit();
                    });
                }
            });
        </script>
    </main>
</body>
</html>
