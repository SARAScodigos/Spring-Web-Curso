<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: base(~{::contenido})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<main th:fragment="contenido" class="container my-5">
    <form th:action="@{/user/productos}" method="get">
        <div class="row">

            <!-- ================= FILTROS ================= -->
            <div class="col-md-3 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5 class="mb-0">Filtros</h5>
                    </div>
                    <div class="card-body">

                        <h6>Categorías</h6>
                        <div th:each="c : ${categorias}" class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   th:value="${c.idCategoria}"
                                   th:id="'cat-' + ${c.idCategoria}"
                                   th:checked="${categoriasSeleccionadas.contains(c.idCategoria)}"
                                   name="categorias">
                            <label class="form-check-label" th:for="'cat-' + ${c.idCategoria}" th:text="${c.nombre}"></label>
                        </div>

                        <hr>

                        <h6>Precio máximo: <span id="precio-label" th:text="'S/ ' + (${precioMaxActual} ?: 5000)"></span></h6>
                        <input type="range" class="form-range"
                               name="precioMax" min="0" max="5000" step="50"
                               th:value="${precioMaxActual} ?: 5000"
                               oninput="document.getElementById('precio-label').innerText = 'S/ ' + this.value">

                        <button type="submit" class="btn btn-primary w-100 mt-3">Aplicar filtros</button>
                        <a th:href="@{/user/productos}" class="btn btn-outline-secondary w-100 mt-2">Limpiar filtros</a>
                    </div>
                </div>
            </div>

            <!-- ================= PRODUCTOS ================= -->
            <div class="col-md-9">

                <div class="row mb-4">
                    <div class="col-md-8">
                        <input type="text" name="buscar" class="form-control"
                               placeholder="🔍 Buscar productos..." th:value="${buscarActual}">
                    </div>
                    <div class="col-md-4">
                        <select class="form-select" name="orden" onchange="this.form.submit()">
                            <option value="">Ordenar por</option>
                            <option value="menor" th:selected="${ordenActual == 'menor'}">Menor precio</option>
                            <option value="mayor" th:selected="${ordenActual == 'mayor'}">Mayor precio</option>
                            <option value="recientes" th:selected="${ordenActual == 'recientes'}">Más recientes</option>
                        </select>
                    </div>
                </div>

                <div class="row" th:if="${not #lists.isEmpty(productos)}">
                    <div class="col-md-4 mb-4" th:each="p : ${productos}">
                        <div class="producto-card">
                            <div class="producto-img-wrapper">
                                <img th:src="${p.image != null && p.image != ''} ? @{'/img/' + ${p.image}} : @{/img/default.jpg}" alt="Producto">
                                <span class="producto-badge" th:text="${p.nombreCategoria}"></span>
                            </div>
                            <div class="producto-body">
                                <h5 th:text="${p.nombre}"></h5>
                                <div class="producto-precio" th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 2)}"></div>
                                <button type="button" class="btn-agregar-carrito"
                                        th:data-id="${p.idProducto}"
                                        th:data-nombre="${p.nombre}"
                                        th:data-precio="${p.precio}"
                                        onclick="agregarAlCarritoDesdeBoton(this)">
                                    <i class="bi bi-cart-plus"></i> Agregar al carrito
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(productos)}" class="text-center text-muted py-5">
                    <i class="bi bi-search fs-1"></i>
                    <p class="mt-3">No se encontraron productos con esos filtros.</p>
                </div>

            </div>
        </div>
    </form>
</main>
</body>
</html>
