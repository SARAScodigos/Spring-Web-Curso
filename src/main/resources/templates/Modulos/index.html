<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: base(~{::contenido})}">
<head>
    <meta charset="UTF-8">
    <title>PC Store - Tienda Tecnológica</title>
</head>
<body>

    <main th:fragment="contenido">
        <!-- 1. Carrusel de Banners -->
        <div th:replace="~{fragments/components :: carousel}"></div>

        <!-- 2. Categorías Destacadas -->
        <div th:replace="~{fragments/components :: categoriasGrid}"></div>

        <!-- 3. Productos Destacados -->
        <section class="container my-5">
            <h2 class="text-center mb-4 fw-bold" style="color: #0e355a;">Productos Destacados</h2>

            <div class="row g-4">
                <div class="col-md-4 col-sm-6" th:each="producto : ${productos}">
                    <!-- Inserta el componente reutilizable de tarjeta de producto -->
                    <div th:replace="~{fragments/components :: productoCard(${producto}, false)}"></div>
                </div>
                
                <div th:if="${#lists.isEmpty(productos)}" class="col-12 text-center py-5">
                    <i class="bi bi-inbox text-muted display-1 d-block mb-3"></i>
                    <p class="text-muted lead">No hay productos destacados registrados.</p>
                </div>
            </div>
        </section>

        <!-- 4. Oferta del Día -->
        <div th:replace="~{fragments/components :: ofertaDia}"></div>
    </main>

</body>
</html>
