<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="base(contenidoAdmin)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="/css/AdminStyle.css" rel="stylesheet" th:href="@{/css/AdminStyle.css}">
    <title>Title</title>
</head>
<body>
    <div class="d-flex">
        <aside class="sidebar p-3">
        <h3 class="text-white text-center mb-4">
            <i class="bi bi-shop"></i> Admin
        </h3>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a th:href="@{/admin/dashboard}" class="nav-link">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/admin/productos}" class="nav-link">
                    <i class="bi bi-box-seam"></i>
                    Productos
                </a>
            </li>

            <li class="nav-item">
                <a th:href="@{/admin/pedidos}" class="nav-link">
                    <i class="bi bi-cart-check"></i>
                    Pedidos
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/admin/usuarios}" class="nav-link">
                    <i class="bi bi-people"></i>
                    Usuarios
                </a>
            </li>

            <li class="nav-item mt-4">
                <a th:href="@{/logout}" class="nav-link text-danger">
                    <i class="bi bi-box-arrow-right"></i>
                    Cerrar sesión
                </a>
            </li>
        </ul>
        </aside>
        <!--contenido-->
        <main class="flex-grow-1">
            <div class="p-3 border-bottom bg-white d-flex justify-content-between align-items-center">
                <span class="fw-semibold">
                    Bienvenido, <span th:text="${session.usuarioNombre != null ? session.usuarioNombre : 'Admin'}"></span>
                    <small class="d-block text-muted" th:text="${session.usuarioRol != null ? session.usuarioRol : 'ADMIN'}"></small>
                </span>
                <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Cerrar sesión</a>
            </div>
            <div th:replace="${contenidoAdmin}">

            </div>
        </main>
    </div>
</body>
</html>
