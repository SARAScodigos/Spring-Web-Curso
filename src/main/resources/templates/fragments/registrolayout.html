<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link th:href="@{/css/estiloprincipal.css}" rel="stylesheet">
    <title>Crear cuenta - PC Store</title>
</head>
<body>
<div class="contenedor-login">
    <div class="login-izquierdo">
        <img th:src="@{/img/LOGO PNG.png}" class="logoWeb-login logo" alt="Logo">
        <h1>PC Store</h1>
        <p>Especialistas en tecnología, accesorios y servicio técnico confiable.</p>
        <p>En PC Store te ofrecemos calidad, confianza y las mejores soluciones para tus equipos.</p>
    </div>

    <div class="login-derecho">
        <div class="login-card">
            <h2>Crear cuenta</h2>
            <p class="login-subtitle">Completa tus datos para registrarte</p>

            <div th:if="${error}" class="alert-login-error">
                <i class="bi bi-exclamation-circle"></i>
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/registro}" method="post">
                <div class="input-group-login">
                    <label for="nombre">Nombre completo</label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-person"></i>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required minlength="3" maxlength="30">
                    </div>
                </div>

                <div class="input-group-login">
                    <label for="correo">Correo electrónico</label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-envelope"></i>
                        <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>
                    </div>
                </div>

                <div class="input-group-login">
                    <label for="password">Contraseña</label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required minlength="8">
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    Crear cuenta <i class="bi bi-arrow-right-short"></i>
                </button>
            </form>

            <a th:href="@{/}" class="volver-inicio">
                <i class="bi bi-arrow-left"></i> Ya tengo cuenta, iniciar sesión
            </a>
        </div>
    </div>
</div>
</body>
</html>
