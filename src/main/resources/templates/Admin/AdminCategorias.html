<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/Admilayout :: base(~{::contenidoAdmin})}">
<head>
    <meta charset="UTF-8">
    <title>Categorías</title>
</head>
<body>
<main th:fragment="contenidoAdmin" class="p-4 content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Categorías</h2>
            <p class="text-muted mb-0">Administra las categorías de tus productos.</p>
        </div>
        <a th:href="@{/admin/productos}" class="btn btn-outline-dark">Volver a productos</a>
    </div>

    <div class="card card-dashboard p-4 mb-4">
        <h5 class="mb-3">Nueva categoría</h5>
        <form th:action="@{/admin/categorias}" method="post" th:object="${categoriaForm}">
            <div class="row g-3">
                <div class="col-md-5">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Descripción</label>
                    <input type="text" class="form-control" th:field="*{descripcion}" required>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-dark w-100">Guardar</button>
                </div>
            </div>
        </form>
    </div>

    <div class="card card-dashboard p-4">
        <h5 class="mb-3">Listado de categorías</h5>
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="categoria : ${categorias}">
                    <td th:text="${categoria.idCategoria}"></td>
                    <td th:text="${categoria.nombre}"></td>
                    <td th:text="${categoria.descripcion}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
