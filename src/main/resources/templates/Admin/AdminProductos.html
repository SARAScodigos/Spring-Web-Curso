<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/Admilayout :: base(~{::contenidoAdmin})}">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
</head>
<body>
<main th:fragment="contenidoAdmin" class="p-4 content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Gestión de productos</h2>
            <p class="text-muted mb-0">Crea, edita y administra los productos desde la base de datos.</p>
        </div>
        <a th:href="@{/admin/categorias}" class="btn btn-outline-dark">Gestionar categorías</a>
    </div>

    <div class="card card-dashboard p-4 mb-4">
        <h5 class="mb-3" th:text="${modoEdicion} ? 'Editar producto' : 'Nuevo producto'"></h5>
        <form th:action="${modoEdicion} ? @{/admin/productos/{id}/editar(id=${productoId})} : @{/admin/productos}" method="post" th:object="${productoForm}" enctype="multipart/form-data">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Precio</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{precio}" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Stock</label>
                    <input type="number" class="form-control" th:field="*{stock}" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label d-flex align-items-center justify-content-between">
                        <span>Imagen</span>
                        <img th:if="*{image != null && !#strings.isEmpty(image)}" th:src="*{image}" class="rounded border" style="height: 24px; width: 24px; object-fit: cover;">
                    </label>
                    <input type="file" name="imagenFile" class="form-control" accept="image/*">
                    <input type="hidden" th:field="*{image}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Categoría</label>
                    <select class="form-select" th:field="*{idCategoria}" required>
                        <option value="">Selecciona una categoría</option>
                        <option th:each="categoria : ${categorias}" th:value="${categoria.idCategoria}" th:text="${categoria.nombre}"></option>
                    </select>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button class="btn btn-dark" type="submit">Guardar</button>
                    <a th:if="${modoEdicion}" th:href="@{/admin/productos}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </div>
        </form>
    </div>

    <div class="card card-dashboard p-4">
        <h5 class="mb-3">Productos registrados</h5>
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Categoría</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="producto : ${productos}">
                    <td th:text="${producto.idProducto}"></td>
                    <td th:text="${producto.nombre}"></td>
                    <td th:text="${#numbers.formatDecimal(producto.precio, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td th:text="${producto.stock}"></td>
                    <td th:text="${producto.nombreCategoria}"></td>
                    <td>
                        <span class="badge rounded-pill" th:classappend="${producto.stock <= 5} ? 'bg-warning text-dark' : 'bg-success'"
                              th:text="${producto.stock <= 5} ? 'Stock bajo' : 'Disponible'"></span>
                    </td>
                    <td>
                        <a class="btn btn-sm btn-outline-primary me-2" th:href="@{/admin/productos/{id}/editar(id=${producto.idProducto})}">Editar</a>
                        <form th:action="@{/admin/productos/{id}/eliminar(id=${producto.idProducto})}" method="post" class="d-inline">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
